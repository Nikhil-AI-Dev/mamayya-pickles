<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>No internet - Mamayya Pickles</title>
<style>
  body { margin: 0; background: #fff4e4; color: #241713; font-family: Arial, Helvetica, sans-serif;
         min-height: 100vh; display: grid; place-items: center; }
  .card { text-align: center; padding: 48px 28px; max-width: 420px; }
  .jar { font-size: 56px; }
  h1 { font-size: 26px; font-weight: 900; margin: 18px 0 0; }
  .telugu { color: #a92a1d; margin-top: 10px; font-size: 15px; }
  p { color: #5c4a3a; line-height: 1.6; margin-top: 14px; font-size: 14px; }
  button { margin-top: 22px; background: #a92a1d; color: #fff4e4; border: 0; border-radius: 999px;
           padding: 14px 34px; font-size: 15px; font-weight: 800; cursor: pointer; }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="jar" aria-hidden>🫙</div>
    <h1>No internet right now.</h1>
    <div class="telugu">Signal ledu. Pickle ready ga undi.</div>
    <p>Check your connection and try again - your cart is saved on this
       device and will be waiting exactly as you left it.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
